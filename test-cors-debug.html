<!DOCTYPE html>
<html>
<head>
    <title>CORS Debug Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #000; color: #0f0; }
        .step { margin: 20px 0; padding: 10px; border: 1px solid #0f0; }
        .success { color: #0f0; }
        .error { color: #f00; }
        .info { color: #ff0; }
        button { padding: 10px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔍 CORS Debug für GCS Upload</h1>
    
    <button onclick="runTest()">START TEST</button>
    <div id="output"></div>
    
    <script>
        const log = (msg, type = 'info') => {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `[${new Date().toTimeString().split(' ')[0]}] ${msg}`;
            document.getElementById('output').appendChild(div);
            console.log(msg);
        };
        
        async function runTest() {
            document.getElementById('output').innerHTML = '';
            
            try {
                // STEP 1: Get signed URL
                log('=== SCHRITT 1: Hole Signed URL vom Server ===', 'info');
                const urlResponse = await fetch('/api/gcs/upload-url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        dealId: 23,
                        fileName: 'test-cors.zip',
                        contentType: 'application/zip'
                    })
                });
                
                if (!urlResponse.ok) {
                    throw new Error(`Server Error: ${urlResponse.status}`);
                }
                
                const data = await urlResponse.json();
                log(`✓ Signed URL erhalten`, 'success');
                log(`URL: ${data.uploadUrl.substring(0, 100)}...`, 'info');
                
                // STEP 2: Parse URL
                log('=== SCHRITT 2: Analysiere URL ===', 'info');
                const url = new URL(data.uploadUrl);
                log(`Host: ${url.host}`, 'info');
                log(`Path: ${url.pathname}`, 'info');
                
                // STEP 3: Test CORS Preflight
                log('=== SCHRITT 3: Teste CORS Preflight ===', 'info');
                try {
                    const corsResponse = await fetch(data.uploadUrl, {
                        method: 'OPTIONS',
                        headers: {
                            'Access-Control-Request-Method': 'PUT',
                            'Access-Control-Request-Headers': 'content-type',
                            'Origin': window.location.origin
                        }
                    });
                    log(`Preflight Status: ${corsResponse.status}`, corsResponse.ok ? 'success' : 'error');
                    
                    // Check CORS headers
                    const corsHeaders = [
                        'access-control-allow-origin',
                        'access-control-allow-methods',
                        'access-control-allow-headers',
                        'access-control-max-age'
                    ];
                    
                    corsHeaders.forEach(header => {
                        const value = corsResponse.headers.get(header);
                        if (value) {
                            log(`${header}: ${value}`, 'success');
                        } else {
                            log(`${header}: FEHLT!`, 'error');
                        }
                    });
                } catch (e) {
                    log(`CORS Preflight FEHLGESCHLAGEN: ${e.message}`, 'error');
                }
                
                // STEP 4: Try actual PUT
                log('=== SCHRITT 4: Teste PUT Request ===', 'info');
                const testData = new Blob(['test'], { type: 'application/zip' });
                
                try {
                    const putResponse = await fetch(data.uploadUrl, {
                        method: 'PUT',
                        body: testData,
                        headers: {
                            'Content-Type': 'application/zip'
                        },
                        mode: 'cors'
                    });
                    
                    if (putResponse.ok) {
                        log(`✓ PUT erfolgreich! Status: ${putResponse.status}`, 'success');
                        log('🎉 CORS FUNKTIONIERT!', 'success');
                    } else {
                        log(`✗ PUT fehlgeschlagen: ${putResponse.status}`, 'error');
                        const error = await putResponse.text();
                        log(`Fehler: ${error}`, 'error');
                    }
                } catch (e) {
                    log(`✗ PUT Request FEHLGESCHLAGEN: ${e.message}`, 'error');
                    log('CORS PROBLEM BESTÄTIGT!', 'error');
                }
                
            } catch (error) {
                log(`FEHLER: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
