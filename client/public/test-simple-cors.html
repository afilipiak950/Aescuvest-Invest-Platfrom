<!DOCTYPE html>
<html>
<head>
    <title>Simple CORS Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px 0; }
        .error { color: #f00; }
        .success { color: #0f0; }
        pre { background: #000; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>🔍 Simple CORS Test for GCS</h1>
    <button onclick="testCORS()">TEST DIRECT GCS ACCESS</button>
    <div id="output"></div>

    <script>
        async function testCORS() {
            const output = document.getElementById('output');
            output.innerHTML = '<h2>Testing...</h2>';
            
            try {
                // Test 1: Direct fetch to GCS bucket (should work with CORS enabled)
                console.log('Testing direct GCS access...');
                const response = await fetch('https://storage.googleapis.com/aescuvest-uploads-2025/', {
                    method: 'HEAD',
                    mode: 'cors'
                });
                
                if (response.ok || response.status === 403) {
                    output.innerHTML += '<p class="success">✅ CORS IS WORKING! (Got response from GCS)</p>';
                    output.innerHTML += `<p>Status: ${response.status}</p>`;
                    output.innerHTML += '<p>Headers:</p><pre>' + JSON.stringify([...response.headers.entries()], null, 2) + '</pre>';
                } else {
                    output.innerHTML += `<p class="error">❌ Unexpected status: ${response.status}</p>`;
                }
            } catch (error) {
                output.innerHTML += '<p class="error">❌ CORS BLOCKED: ' + error.message + '</p>';
                
                // Test 2: Try OPTIONS request
                try {
                    const optionsResponse = await fetch('https://storage.googleapis.com/aescuvest-uploads-2025/', {
                        method: 'OPTIONS',
                        headers: {
                            'Access-Control-Request-Method': 'PUT',
                            'Access-Control-Request-Headers': 'content-type'
                        }
                    });
                    output.innerHTML += '<p class="success">✅ OPTIONS request succeeded</p>';
                } catch (optError) {
                    output.innerHTML += '<p class="error">❌ OPTIONS also failed: ' + optError.message + '</p>';
                }
            }
            
            output.innerHTML += '<hr><h3>Recommendation:</h3>';
            output.innerHTML += '<p>Use the Chunked Upload method which already works perfectly!</p>';
            output.innerHTML += '<p>Go to your Data Room page and upload your ZIP file there.</p>';
        }
    </script>
</body>
</html>
