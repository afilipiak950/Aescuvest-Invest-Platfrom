<!DOCTYPE html>
<html>
<head>
    <title>GCS Upload Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #1a1a1a; color: white; }
        .container { max-width: 800px; margin: 0 auto; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #0a4f0a; border: 1px solid #0f0; }
        .error { background: #4f0a0a; border: 1px solid #f00; }
        .info { background: #0a0a4f; border: 1px solid #00f; }
        button { padding: 10px 20px; margin: 10px 0; cursor: pointer; }
        input { padding: 10px; margin: 10px 0; width: 100%; }
        pre { background: #2a2a2a; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 GCS Direct Upload Test</h1>
        
        <div>
            <input type="file" id="fileInput" accept=".zip">
            <button onclick="testUpload()">Test GCS Upload</button>
        </div>
        
        <div id="status"></div>
        <pre id="log"></pre>
    </div>
    
    <script>
        const baseUrl = window.location.origin;
        const dealId = 23;
        
        function log(message, type = 'info') {
            const status = document.getElementById('status');
            const logEl = document.getElementById('log');
            
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = message;
            status.appendChild(div);
            
            logEl.textContent += `[${new Date().toISOString()}] ${message}\n`;
            console.log(message);
        }
        
        async function testUpload() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                log('Please select a file', 'error');
                return;
            }
            
            log(`📁 Testing with file: ${file.name} (${(file.size / 1024 / 1024).toFixed(1)}MB)`, 'info');
            
            try {
                // Step 1: Get signed URL
                log('🔐 Requesting signed URL from server...', 'info');
                const urlResponse = await fetch('/api/gcs/upload-url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        dealId: dealId,
                        fileName: file.name,
                        contentType: 'application/zip'
                    })
                });
                
                if (!urlResponse.ok) {
                    throw new Error(`Server error: ${urlResponse.status}`);
                }
                
                const urlData = await urlResponse.json();
                log(`✅ Got signed URL`, 'success');
                log(`GCS Path: ${urlData.gcsPath}`, 'info');
                log(`Method: ${urlData.method || 'PUT'}`, 'info');
                
                // Step 2: Test CORS preflight
                log('🔍 Testing CORS preflight...', 'info');
                try {
                    const corsTest = await fetch(urlData.uploadUrl, {
                        method: 'OPTIONS',
                        headers: {
                            'Access-Control-Request-Method': urlData.method || 'PUT',
                            'Access-Control-Request-Headers': 'Content-Type'
                        }
                    });
                    log(`CORS preflight response: ${corsTest.status}`, corsTest.ok ? 'success' : 'error');
                } catch (corsError) {
                    log(`CORS preflight failed: ${corsError.message}`, 'error');
                }
                
                // Step 3: Try upload
                log('☁️ Uploading to GCS...', 'info');
                const startTime = Date.now();
                
                const uploadResponse = await fetch(urlData.uploadUrl, {
                    method: urlData.method || 'PUT',
                    body: file,
                    headers: urlData.headers || {
                        'Content-Type': 'application/zip'
                    },
                    mode: 'cors'
                });
                
                const uploadTime = ((Date.now() - startTime) / 1000).toFixed(1);
                
                if (!uploadResponse.ok) {
                    const errorText = await uploadResponse.text();
                    throw new Error(`Upload failed: ${uploadResponse.status} - ${errorText}`);
                }
                
                log(`✅ Upload successful in ${uploadTime}s!`, 'success');
                
                // Step 4: Register upload
                log('📝 Registering upload...', 'info');
                const registerResponse = await fetch('/api/gcs/register-upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        dealId: dealId,
                        gcsPath: urlData.gcsPath,
                        fileName: file.name,
                        fileSize: file.size
                    })
                });
                
                if (!registerResponse.ok) {
                    throw new Error('Registration failed');
                }
                
                const registerData = await registerResponse.json();
                log(`✅ Upload registered! Document ID: ${registerData.document.id}`, 'success');
                log('🎉 GCS UPLOAD COMPLETE!', 'success');
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        }
    </script>
</body>
</html>
