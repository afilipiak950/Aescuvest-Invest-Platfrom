<!DOCTYPE html>
<html>
<head>
    <title>GCS Upload Final Test</title>
    <style>
        body { 
            font-family: 'Courier New', monospace; 
            padding: 20px; 
            background: #0a0a0a; 
            color: #00ff00;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { color: #00ff00; border-bottom: 2px solid #00ff00; padding-bottom: 10px; }
        .test-section {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        button { 
            padding: 12px 24px; 
            font-size: 16px; 
            margin: 10px 5px; 
            background: #00aa00;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover { background: #00dd00; color: #000; }
        .error { color: #ff3333; font-weight: bold; }
        .success { color: #00ff00; font-weight: bold; }
        .warning { color: #ffaa00; }
        .info { color: #00aaff; }
        pre { 
            background: #000; 
            padding: 10px; 
            overflow: auto; 
            border: 1px solid #333;
            border-radius: 4px;
        }
        .log-entry { margin: 5px 0; padding: 5px; border-left: 3px solid #333; }
        .log-success { border-left-color: #00ff00; }
        .log-error { border-left-color: #ff3333; }
        .log-info { border-left-color: #00aaff; }
        #fileInput { 
            display: none; 
        }
        .file-label {
            display: inline-block;
            padding: 12px 24px;
            background: #0066cc;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 5px;
        }
        .file-label:hover { background: #0088ff; }
    </style>
</head>
<body>
    <h1>🚀 GCS Direct Upload - Production Ready Test</h1>
    
    <div class="test-section">
        <h2>Test 1: Simple CORS Check</h2>
        <button onclick="testSimpleCORS()">TEST SIMPLE CORS</button>
        <div id="simple-output"></div>
    </div>

    <div class="test-section">
        <h2>Test 2: Upload Small File</h2>
        <input type="file" id="fileInput" onchange="handleFileSelect(event)">
        <label for="fileInput" class="file-label">SELECT FILE TO UPLOAD</label>
        <button onclick="testFileUpload()" id="uploadBtn" style="display:none;">UPLOAD TO GCS</button>
        <div id="file-info"></div>
        <div id="upload-output"></div>
    </div>

    <div class="test-section">
        <h2>Test 3: Alternative Upload Method</h2>
        <button onclick="testAlternativeUpload()">TEST ALTERNATIVE METHOD</button>
        <div id="alt-output"></div>
    </div>

    <div class="test-section">
        <h2>Debug Log</h2>
        <div id="debug-log"></div>
    </div>

    <script>
        let selectedFile = null;
        const dealId = 23; // Test deal ID
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('debug-log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.innerHTML = `[${timestamp}] <span class="${type}">${message}</span>`;
            logDiv.appendChild(entry);
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        async function testSimpleCORS() {
            const output = document.getElementById('simple-output');
            output.innerHTML = '<p class="info">Testing CORS...</p>';
            log('Starting simple CORS test', 'info');
            
            try {
                // Test 1: Can we reach GCS at all?
                const response = await fetch('https://storage.googleapis.com/', {
                    method: 'HEAD',
                    mode: 'cors'
                });
                
                if (response.ok || response.status === 403 || response.status === 400) {
                    output.innerHTML = '<p class="success">✅ CORS is enabled on GCS!</p>';
                    log('CORS test successful - GCS responded', 'success');
                } else {
                    output.innerHTML = `<p class="warning">⚠️ Unexpected status: ${response.status}</p>`;
                    log(`Unexpected status: ${response.status}`, 'error');
                }
            } catch (error) {
                output.innerHTML = `<p class="error">❌ CORS blocked: ${error.message}</p>`;
                log(`CORS blocked: ${error.message}`, 'error');
            }
        }

        function handleFileSelect(event) {
            selectedFile = event.target.files[0];
            if (selectedFile) {
                const info = document.getElementById('file-info');
                info.innerHTML = `
                    <p class="info">Selected: ${selectedFile.name}</p>
                    <p class="info">Size: ${(selectedFile.size / 1024).toFixed(2)} KB</p>
                    <p class="info">Type: ${selectedFile.type || 'unknown'}</p>
                `;
                document.getElementById('uploadBtn').style.display = 'inline-block';
                log(`File selected: ${selectedFile.name} (${(selectedFile.size / 1024).toFixed(2)} KB)`, 'info');
            }
        }

        async function testFileUpload() {
            if (!selectedFile) {
                alert('Please select a file first');
                return;
            }

            const output = document.getElementById('upload-output');
            output.innerHTML = '<p class="info">Starting upload...</p>';
            log(`Starting upload of ${selectedFile.name}`, 'info');

            try {
                // Step 1: Get signed URL from server
                log('Requesting signed URL from server...', 'info');
                const urlResponse = await fetch('/api/gcs/upload-url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        dealId: dealId,
                        fileName: selectedFile.name,
                        contentType: selectedFile.type || 'application/octet-stream'
                    })
                });

                if (!urlResponse.ok) {
                    throw new Error(`Server error: ${urlResponse.status}`);
                }

                const { uploadUrl, gcsPath, method, headers } = await urlResponse.json();
                log(`Got signed URL: ${uploadUrl.substring(0, 100)}...`, 'success');
                log(`Method: ${method || 'PUT'}`, 'info');
                log(`Headers: ${JSON.stringify(headers)}`, 'info');

                // Step 2: Upload directly to GCS
                log('Uploading to GCS...', 'info');
                output.innerHTML = '<p class="info">Uploading to Google Cloud Storage...</p>';
                
                // Create upload headers - must match exactly what was signed
                const uploadHeaders = {};
                if (headers && headers['Content-Type']) {
                    uploadHeaders['Content-Type'] = headers['Content-Type'];
                }
                
                const uploadResponse = await fetch(uploadUrl, {
                    method: method || 'PUT',
                    body: selectedFile,
                    headers: uploadHeaders,
                    mode: 'cors'
                });

                if (uploadResponse.ok) {
                    output.innerHTML = `
                        <p class="success">✅ Upload successful!</p>
                        <p class="info">File uploaded to: ${gcsPath}</p>
                    `;
                    log(`Upload successful! File at: ${gcsPath}`, 'success');
                    
                    // Step 3: Register with server
                    log('Registering upload with server...', 'info');
                    const registerResponse = await fetch('/api/gcs/register-upload', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            dealId: dealId,
                            gcsPath: gcsPath,
                            fileName: selectedFile.name,
                            fileSize: selectedFile.size
                        })
                    });
                    
                    if (registerResponse.ok) {
                        const result = await registerResponse.json();
                        log(`Registration complete! Job ID: ${result.jobId}`, 'success');
                        output.innerHTML += `<p class="success">✅ Processing job created: ${result.jobId}</p>`;
                    }
                } else {
                    const errorText = await uploadResponse.text().catch(() => 'No details');
                    throw new Error(`Upload failed: ${uploadResponse.status} - ${errorText}`);
                }
            } catch (error) {
                output.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
                log(`Upload failed: ${error.message}`, 'error');
                
                // Show detailed error info
                output.innerHTML += `
                    <details>
                        <summary>Error Details</summary>
                        <pre>${error.stack || error.message}</pre>
                    </details>
                `;
            }
        }

        async function testAlternativeUpload() {
            const output = document.getElementById('alt-output');
            output.innerHTML = '<p class="info">Testing alternative upload method...</p>';
            log('Testing alternative upload with minimal headers', 'info');
            
            // Create a small test file
            const testContent = 'This is a test file for GCS upload ' + new Date().toISOString();
            const testFile = new Blob([testContent], { type: 'text/plain' });
            const testFileName = `test-${Date.now()}.txt`;
            
            try {
                // Get signed URL
                log('Getting signed URL for test file...', 'info');
                const urlResponse = await fetch('/api/gcs/upload-url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        dealId: dealId,
                        fileName: testFileName,
                        contentType: 'text/plain'
                    })
                });

                const { uploadUrl } = await urlResponse.json();
                log('Got signed URL, attempting upload...', 'info');

                // Try upload with minimal configuration
                const uploadResponse = await fetch(uploadUrl, {
                    method: 'PUT',
                    body: testFile,
                    headers: {
                        'Content-Type': 'text/plain'
                    }
                });

                if (uploadResponse.ok) {
                    output.innerHTML = '<p class="success">✅ Alternative method works!</p>';
                    log('Alternative upload successful!', 'success');
                } else {
                    throw new Error(`Status ${uploadResponse.status}`);
                }
            } catch (error) {
                output.innerHTML = `<p class="error">❌ Alternative method failed: ${error.message}</p>`;
                log(`Alternative method failed: ${error.message}`, 'error');
            }
        }

        // Auto-run simple CORS test on load
        window.addEventListener('load', () => {
            log('Page loaded, ready for testing', 'info');
            testSimpleCORS();
        });
    </script>
</body>
</html>
