# Google App Engine configuration for large file uploads
runtime: nodejs20

env_variables:
  NODE_ENV: production

instance_class: F4_1G

# Critical for large file uploads
automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.6

# Request timeout for large uploads (maximum allowed)
readiness_check:
  timeout_sec: 240
  check_interval_sec: 5

liveness_check:
  timeout_sec: 240
  check_interval_sec: 30

# Network settings for large uploads
network:
  instance_tag: large-upload-enabled

# Service account with storage permissions
service_account: aescuvest-upload@PROJECT_ID.iam.gserviceaccount.com

handlers:
- url: /.*
  script: auto
  secure: always
  # CRITICAL: Remove request size limit for Cloud Run
  upload: (?!^.*/upload/.*$).*