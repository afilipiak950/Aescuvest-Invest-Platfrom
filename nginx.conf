# 🚨 CRITICAL: COMPLETE Nginx configuration for production
# This configuration ensures API routes work AND eliminates 413 errors

events {
    worker_connections 1024;
}

http {
    # CRITICAL: Global settings for large uploads
    client_max_body_size 0;  # UNLIMITED uploads - ELIMINATE 413 ERRORS COMPLETELY
    client_body_buffer_size 128k;
    client_body_timeout 3600s;  # 1 hour timeout
    client_header_timeout 3600s;
    send_timeout 3600s;
    keepalive_timeout 3600s;
    
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # CRITICAL: Upstream to Node.js server
    upstream nodejs_backend {
        server 127.0.0.1:5000;
    }

    # CRITICAL: Main server block
    server {
        listen 80;
        server_name _;
        
        # PRODUCTION DEBUG: Add request logging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log debug;

        # API routes - CRITICAL: Route to Node.js backend
        location /api/ {
            proxy_pass http://nodejs_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Large upload specific settings
            client_max_body_size 0;
            client_body_buffer_size 1m;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 7200s;
            proxy_connect_timeout 7200s;
            proxy_send_timeout 7200s;
        }

        # Frontend static files
        location / {
            root /app/client/dist;
            try_files $uri $uri/ /index.html;
            
            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}