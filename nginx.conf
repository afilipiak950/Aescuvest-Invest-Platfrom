# 🚨 CRITICAL: Nginx configuration for MASSIVE file uploads
# This file eliminates ALL 413 errors at the infrastructure level

client_max_body_size 55g;  # Allow 55GB uploads - ELIMINATE 413 ERRORS
client_body_buffer_size 128k;
client_body_timeout 3600s;  # 1 hour timeout
client_header_timeout 3600s;
send_timeout 3600s;
keepalive_timeout 3600s;

# Disable buffering for upload routes to prevent 413 errors
location /api/deals/*/data-room/upload-zip {
    client_max_body_size 55g;
    client_body_buffer_size 1m;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 7200s;
    proxy_connect_timeout 7200s;
    proxy_send_timeout 7200s;
}

location /api/upload/ {
    client_max_body_size 55g;
    client_body_buffer_size 1m;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 7200s;
    proxy_connect_timeout 7200s;
    proxy_send_timeout 7200s;
}

# General upload handling
location ~ ^/api/.*upload.* {
    client_max_body_size 55g;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 7200s;
    proxy_connect_timeout 7200s;
    proxy_send_timeout 7200s;
}