# Google Cloud Run Service Configuration for Large File Uploads
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aescuvest-platform
  namespace: "1234567890"
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/binary-authorization-breakglass: "true"
spec:
  template:
    metadata:
      annotations:
        # CRITICAL: Allow 50GB uploads
        run.googleapis.com/memory: "32Gi"
        run.googleapis.com/cpu: "8"
        run.googleapis.com/timeout: "7200s"
        run.googleapis.com/max-instances: "10"
        # CRITICAL: Body size limit for massive uploads (ELIMINATE 413 ERRORS COMPLETELY)
        run.googleapis.com/body-size-limit: "59055800320"  # 55GB in bytes - PRODUCTION FIX
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/vpc-access-connector: ""
        run.googleapis.com/network-acceleration: "enabled"
        # Additional Cloud Run optimizations for large uploads
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/network-interfaces: "[{\"network\":\"default\",\"subnetwork\":\"default\"}]"
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/minScale: "1"
    spec:
      containerConcurrency: 1000
      serviceAccountName: aescuvest-upload@PROJECT_ID.iam.gserviceaccount.com
      timeoutSeconds: 7200
      containers:
      - image: gcr.io/PROJECT_ID/aescuvest-platform
        ports:
        - name: http1
          containerPort: 5000
        env:
        - name: NODE_ENV
          value: production
        - name: NODE_OPTIONS
          value: --max-old-space-size=32768
        - name: UV_THREADPOOL_SIZE
          value: "128"
        resources:
          limits:
            cpu: "8000m"
            memory: "32Gi"
          requests:
            cpu: "4000m"
            memory: "16Gi"
        # Health checks
        livenessProbe:
          httpGet:
            path: /api/test-route
            port: 5000
          initialDelaySeconds: 10
          timeoutSeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/test-route
            port: 5000
          initialDelaySeconds: 5
          timeoutSeconds: 10
          periodSeconds: 10
  traffic:
  - percent: 100
    latestRevision: true